<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>News Article — KrishiNet</title>

  <!-- Bootstrap + FontAwesome (needed for navbar icon) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: Poppins, system-ui, -apple-system, "Segoe UI", Roboto, Arial; }
    #newsFrame { width:100%; height:720px; border:0; border-radius:6px; display:block; }
    #blockedMsg p { margin-bottom: .8rem; }
  </style>
</head>
<body>
  <!-- Header -->
  <nav class="navbar navbar-expand-lg sticky-top bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="fas fa-leaf me-2"></i>KrishiNet</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="/news">News</a></li>
        </ul>
      </div>
      <div class="d-flex">
        <a class="btn btn-outline-primary me-2" href="/login">Login</a>
        <a class="btn btn-primary" href="/registration">Register</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back</a>

    <div id="embedArea">
      {% if url %}
        <!-- Try embedding. Many sites block this; we detect that and show fallback. -->
        <iframe id="newsFrame" src="{{ url }}" title="News article"></iframe>

        <div id="blockedMsg" class="d-none mt-3 text-center">
          <p>This site prevents embedding — open original article instead.</p>
          <a href="{{ url }}" target="_blank" rel="noopener noreferrer" class="btn btn-success">Open Original</a>
        </div>
      {% else %}
        <div class="alert alert-warning">Article URL not provided.</div>
      {% endif %}
    </div>
  </main>

  <script>
  (function(){
    const iframe = document.getElementById('newsFrame');
    const blocked = document.getElementById('blockedMsg');
    if(!iframe) return;

    // When iframe finishes loading, try to access its document.
    // If cross-origin blocking occurs, accessing will throw and we show the fallback.
    iframe.addEventListener('load', function(){
      try{
        // Accessing contentDocument of a cross-origin iframe throws a security error.
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        // If we reach here, embedding is allowed: hide the blocked message (safety).
        blocked?.classList.add('d-none');
        iframe.classList.remove('d-none');
      }catch(e){
        // Embedding blocked by remote site (X-Frame-Options/CSP) — show fallback.
        blocked?.classList.remove('d-none');
        iframe.classList.add('d-none');
      }
    });

    // Extra: if the user can't load iframe (network etc.), show fallback after 3s
    setTimeout(()=> {
      if (iframe && iframe.classList.contains('d-none') === false) {
        try {
          // try a lightweight access to confirm embed works
          const d = iframe.contentDocument;
        } catch(e) {
          blocked?.classList.remove('d-none');
          iframe.classList.add('d-none');
        }
      }
    }, 3000);
  })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
