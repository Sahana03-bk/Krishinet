<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Loans & Subsidies — KrishiNet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body { font-family: 'Poppins', sans-serif; background:#f4f9f4; }
    .section-header {
      background: linear-gradient(90deg, #2e7d32, #66bb6a);
      color: #fff;
      border-radius: 10px;
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .section-header h1 { font-weight: 700; margin: 0; }
    .section-header p { margin: 0; font-size: 0.95rem; opacity: 0.95; }

    .scheme-card {
      border-radius: 16px;
      border: 1px solid #e0f2e9;
      background: #ffffff;
      box-shadow: 0 6px 16px rgba(46,125,50,0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .scheme-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 24px rgba(46,125,50,0.15);
      border-color: #4caf50;
    }
    .scheme-card .card-title {
      color: #1b5e20;
      font-weight: 600;
    }
    .scheme-card .summary { color: #444; font-size: 0.95rem; }

    .btn-outline-primary {
      --bs-btn-color: #2e7d32;
      --bs-btn-border-color: #2e7d32;
      --bs-btn-hover-bg: #2e7d32;
      --bs-btn-hover-border-color: #2e7d32;
    }

    .filter-bar {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .filter-bar select, .filter-bar input {
      border-radius: 6px;
      border-color: #c8e6c9;
    }
    .filter-bar button {
      border-radius: 6px;
    }

    footer {
      background: #2e7d32;
      color: #fff;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand text-success fw-bold" href="/"><i class="fas fa-leaf me-1"></i>KrishiNet</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          
          <li class="nav-item"><a class="nav-link active fw-semibold" href="/subsidies">Loans & Subsidies</a></li>
          
        </ul>
        
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <!-- Green Header -->
    <div class="section-header">
      <h1>Loans & Subsidies</h1>
      <p>Latest government schemes, credit support and crop-loss relief for Indian farmers. Click "Official" to visit the scheme website.</p>
    </div>

    <!-- Filters -->
    <div class="filter-bar d-flex gap-2 mb-4">
      <select id="filterCategory" class="form-select form-select-sm">
        <option value="">All categories</option>
          <option>Direct Cash Transfer</option>
          <option>Short-term Crop Loan</option>
          <option>Crop Insurance</option>
          <option>Interest Subvention</option>
          <option>Input Advisory / Subsidy</option>
          <option>Disaster Relief / Crop Loss</option>
      </select>

      <input id="q" placeholder="Search schemes..." class="form-control form-control-sm" style="min-width:260px;"/>
      <button id="refreshBtn" class="btn btn-success btn-sm"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <div id="alerts"></div>

    <!-- Schemes Grid -->
    <div class="row g-3" id="schemesWrap">
      <div class="col-12">
        <div class="alert alert-light">Loading schemes…</div>
      </div>
    </div>

    <div class="mt-4 text-end">
      <small class="text-muted" id="lastUpdated">Last updated: —</small>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 mt-5 shadow-sm">
    <div class="container text-center">© KrishiNet — Empowering Farmers</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const el = (s) => document.querySelector(s);
    const escapeHtml = (s) => (s||"").toString()
        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');

    let cached = [];

    async function loadSchemes(){
      showAlert('');
      schemesWrapInner('<div class="col-12"><div class="alert alert-light">Loading schemes…</div></div>');
      try {
        const res = await fetch('/api/subsidies');
        if (!res.ok) throw new Error('Network error');
        const j = await res.json();
        cached = j.items || [];
        renderSchemes(cached);
        document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleString();
      } catch (e) {
        console.error(e);
        showAlert('Could not load schemes. Showing fallback list.', 'warning');
        cached = [
          { name: "PM-Kisan (Fallback)", category: "Direct Cash Transfer", summary: "Income support for eligible farmers.", link:"https://pmkisan.gov.in", source:"Fallback" }
        ];
        renderSchemes(cached);
      }
    }

    function showAlert(msg, type='') {
      const a = el('#alerts');
      if(!msg){ a.innerHTML=''; return; }
      a.innerHTML = `<div class="alert alert-${type || 'info'}">${escapeHtml(msg)}</div>`;
    }

    function schemesWrapInner(html){ el('#schemesWrap').innerHTML = html; }

    function renderSchemes(items){
      if(!items || items.length === 0){
        schemesWrapInner('<div class="col-12"><div class="alert alert-warning">No schemes found.</div></div>');
        return;
      }
      const q = (el('#q').value || '').trim().toLowerCase();
      const cat = (el('#filterCategory').value || '').trim().toLowerCase();

      const filtered = items.filter(it=>{
        const name = (it.name||'').toLowerCase();
        const summary = (it.summary||'').toLowerCase();
        const category = (it.category||'').toLowerCase();
        if(cat && category.indexOf(cat) === -1) return false;
        if(!q) return true;
        return name.includes(q) || summary.includes(q) || category.includes(q);
      });

      if(filtered.length === 0){
        schemesWrapInner('<div class="col-12"><div class="alert alert-warning">No schemes match your search.</div></div>');
        return;
      }

      let html = '';
      filtered.forEach((it) => {
        const summary = escapeHtml(it.summary || '');
        const link = it.link && it.link !== '#' ? it.link : '#';
        html += `
          <div class="col-md-6 col-lg-4">
            <div class="card scheme-card h-100">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">${escapeHtml(it.name)}</h5>
                <div class="mb-2 text-muted small">${escapeHtml(it.source || '')} • ${escapeHtml(it.category || '')}</div>
                <p class="summary mb-3">${summary}</p>
                <div class="mt-auto">
                  <a href="${link}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-primary">Official</a>
                </div>
              </div>
            </div>
          </div>`;
      });

      schemesWrapInner(html);
    }

    document.getElementById('refreshBtn').addEventListener('click', loadSchemes);
    document.getElementById('q').addEventListener('input', ()=>renderSchemes(cached));
    document.getElementById('filterCategory').addEventListener('change', ()=>renderSchemes(cached));

    loadSchemes();
  </script>
</body>
</html>
