<!-- templates/news_preview.html -->
<section id="agri-news" class="py-4">
  <div class="container">
    <h2 class="text-center mb-2">Latest Indian Agriculture News</h2>
    <p class="text-center text-muted mb-4">Day-to-day headlines from trusted Indian sources</p>

    <div id="newsPreviewRow" class="row g-4">
      <!-- JS will populate cards here -->
      <div class="col-12 text-center" id="newsPreviewLoading">
        <div class="spinner-border text-success" role="status" aria-hidden="true"></div>
        <div class="mt-2 text-muted">Loading headlines…</div>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="/news" class="btn btn-outline-primary">View All News</a>
    </div>
  </div>
</section>

<script>
(function(){
  const container = document.getElementById('newsPreviewRow');
  const loading = document.getElementById('newsPreviewLoading');

  function makeCard(a){
    const col = document.createElement('div');
    col.className = 'col-md-4';

    const img = a.image ? `<img src="${a.image}" onerror="this.style.display='none'" class="img-fluid rounded-top" style="height:160px;object-fit:cover;width:100%;">` : '';
    const desc = a.description ? `<p class="text-muted small mb-3">${a.description}</p>` : '';

    // ensure link is encoded
    const readUrl = '/news/view?url=' + encodeURIComponent(a.link || '#');

    col.innerHTML = `
      <div class="card h-100 shadow-sm">
        ${img}
        <div class="card-body d-flex flex-column">
          <div class="small-muted mb-1">Source: <strong>${a.source || 'Unknown'}</strong></div>
          <h5 class="card-title line-2 mb-2" style="color:#1b5e20">${a.title || 'Untitled'}</h5>
          ${desc}
          <div class="mt-auto d-flex justify-content-between align-items-center">
            <small class="text-muted">${a.published || ''}</small>
            <a class="btn btn-sm btn-success" href="${readUrl}">Read Full Article</a>
          </div>
        </div>
      </div>
    `;
    return col;
  }

  async function loadPreview(){
    try {
      const res = await fetch('/api/news?lang=en&limit=6');
      const data = await res.json();
      loading?.remove();
      container.innerHTML = '';
      const items = (data.items || []).slice(0,6);
      if (!items.length){
        container.innerHTML = '<div class="col-12"><div class="alert alert-info">No headlines available right now.</div></div>';
        return;
      }
      items.forEach(it => {
        // normalize if aggregator returns different fields
        const a = {
          title: it.title || it.headline || it.titleText,
          description: it.description || it.summary || it.excerpt || '',
          image: it.image || it.urlToImage || it.top_image || '',
          link: it.link || it.url || it.source_url || '',
          source: it.source || (it.source && it.source.name) || it.site || '',
          published: (it.published || it.publishedAt || it.date || '').slice(0,16)
        };
        container.appendChild(makeCard(a));
      });
    } catch (e){
      loading?.remove();
      container.innerHTML = '<div class="col-12"><div class="alert alert-danger">Could not load headlines.</div></div>';
      console.warn('news preview load failed', e);
    }
  }

  // load on DOM ready
  document.addEventListener('DOMContentLoaded', loadPreview);
})();
</script>
